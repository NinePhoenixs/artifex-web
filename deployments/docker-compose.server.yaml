# 服务器专用 compose。镜像从 ghcr 拉取，不在服务器上 build。
# 发版流水线会把本文件同步到服务器 /opt/artifex/docker-compose.web.yaml。
#
# 前后端各自独立发版：改前端不用重启后端，反之亦然。
services:
  web:
    image: ghcr.io/ninephoenixs/artifex-web:${WEB_TAG:-latest}
    container_name: artifex-web
    restart: unless-stopped
    ports:
      # 只绑本机，对外由服务器上的 nginx 反代过来（见 nginx-host.conf.example）
      - "127.0.0.1:18082:80"
    networks: [artifex]

networks:
  # 和后端容器同一个网络，容器内的 nginx 才能用容器名 artifex-app 访问后端。
  # 由发版流水线提前创建（docker network create artifex）。
  artifex:
    external: true
    name: artifex
