# 前端容器内的 nginx：托管静态文件 + 把 /v1 反代给后端容器。
#
# 同域部署的关键就在这个文件：浏览器眼里前后端是同一个站，
# 不存在跨域，后端也不用维护 CORS 白名单。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：antd 整包较大，压缩后体积约四分之一
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带哈希的构建产物永不变，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存——否则发版后用户拿到旧的 HTML，
    # 里面引用的是已经不存在的旧 assets 文件名，页面直接白屏
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 接口反代到后端
    location /v1/ {
        # 后端容器名，8080 是容器内端口；两个容器要在同一个 docker 网络里。
        # 用变量 + docker 内置 DNS 在请求时再解析：后端没起来时前端照样能启动，
        # 前后端谁先发版都行（写死 upstream 的话 nginx 启动时解析不到会直接退出）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $artifex_backend http://artifex-app:8080;
        proxy_pass $artifex_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生产任务这类接口可能跑得久，别用默认 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退：/apps/xxx/recipes 这种路径在磁盘上没有对应文件，
    # 交给 index.html 由前端路由接管。不配这条，刷新页面就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
