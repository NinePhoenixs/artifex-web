# 自动发版：检查 → 构建镜像（存一份到 ghcr）→ 打成发版包 → 用部署钥匙传给服务器 /opt/artifex/deploy.sh。
# 触发：合并到 main 自动上线；打 v 开头的 tag 也会上线；也可在 Actions 页面手动 Run。
# 镜像直接传过去，服务器不用连 ghcr（国内拉私有镜像慢、也走不了加速）。
# 服务器那边失败会自动回退到上一个版本，这里标红并带日志。
#
# 需要的 Secrets（服务器准备见后端仓库 docs/部署发版指南.md）：
#   DEPLOY_HOST          服务器 IP
#   DEPLOY_SSH_KEY       部署专用私钥（服务器上只允许它运行 deploy.sh）
#   DEPLOY_KNOWN_HOSTS   服务器主机指纹（ssh-keyscan 的输出），防止连错机器
name: 构建并部署

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# 同一时间只跑一次发版，后合并的排队
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 算版本号
        id: v
        # main：sha-提交号；版本 tag：版本号
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx（启用构建缓存）
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          load: true
          tags: artifex-web:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 存一份到 ghcr（留档，找旧版本用）
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for t in ${{ steps.v.outputs.tag }} latest; do
            docker tag artifex-web:${{ steps.v.outputs.tag }} ghcr.io/ninephoenixs/artifex-web:$t
            docker push -q ghcr.io/ninephoenixs/artifex-web:$t
          done

      - name: 打发版包
        run: |
          mkdir bundle
          docker save artifex-web:${{ steps.v.outputs.tag }} | gzip -1 > bundle/image.tar.gz
          tar -czf bundle.tgz -C bundle .
          ls -lh bundle.tgz

      - name: 传到服务器并部署
        run: |
          install -m 600 /dev/null key && echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            deploy@${{ secrets.DEPLOY_HOST }} web < bundle.tgz
          rm -f key
